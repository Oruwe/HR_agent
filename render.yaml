# Render Blueprint -- one command deploy: `render blueprint launch` (or
# "New +" -> "Blueprint" in the Render dashboard), pointed at this repo.
#
# Both services build from the repo's own Dockerfiles, so nothing here is
# Render-specific: `docker compose up --build` and this blueprint deploy the
# identical images.
#
# GOOGLE_API_KEY is the only credential that changes the product. Without it
# the app still deploys and runs -- the dashboard just reports "Offline
# analyst" and the rankings come from the bundled baseline rather than a
# model. Set it in the Render dashboard (or `render env set`) to turn that on.

databases:
  - name: hr-talent-evaluator-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: hr-talent-evaluator-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: HRTE_ENV
        value: production
      - key: HRTE_PII_MODE
        value: strict

      # The pool holds candidate records, so a public URL needs a token.
      # generateValue makes one; read it off the dashboard and paste it into
      # the header field in the top right of the UI.
      - key: HRTE_ADMIN_TOKEN
        generateValue: true

      # A keyed fingerprint survives restarts, so "same person, two records"
      # stays answerable without storing the identifier.
      - key: HRTE_REDACTION_KEY
        generateValue: true

      # The frontend's origin. Set once the frontend service has a URL.
      - key: HRTE_CORS_ORIGINS
        sync: false


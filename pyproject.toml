[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-talent-evaluator"
version = "2.0.0"
description = "AI hiring analyst: scraped candidate records in, ranked hiring recommendations out."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["hiring", "recruiting", "candidate-ranking", "llm", "pii-redaction"]

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "prometheus-client>=0.20",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
# The live analyst. Without it the app runs on its offline provider, which is
# a working deterministic ranker rather than an error path.
analyst = [
  "google-genai>=0.3",
]
# Postgres. SQLite needs nothing extra.
postgres = [
  "psycopg2-binary>=2.9",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "httpx2>=2.13,<3",
  "anyio>=4.6",
  "ruff>=0.4",
]
all = [
  "hr-talent-evaluator[analyst,postgres,dev]",
]

[project.scripts]
hr-talent-evaluator = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: requires a real GOOGLE_API_KEY and reaches the network",
]
# Quality gate: the suite must run clean. Any warning is an error.
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]
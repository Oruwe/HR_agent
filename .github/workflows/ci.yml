name: ci

on:
  push:
    branches: ["**"]
  # Deliberately not the default `pull_request` set. `synchronize` fires on
  # every push to a PR branch, which the `push` trigger above already covers,
  # so the default set ran the whole workflow twice per push -- 8 check runs
  # for 4 jobs, double the Actions minutes, and a check list nobody can read.
  # These three cover the case `push` cannot: a PR opened or reopened on a
  # branch that was pushed earlier.
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The full runtime. No credentials are configured, so CI exercises the
        # offline analyst and every degradation path along with it.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Format check
        run: ruff format --check app tests

      - name: Test suite (warnings are errors)
        run: pytest -q

      - name: Configuration + PII scrubber report
        run: python -m app.main verify

      - name: Seed and rank the demo pool end to end
        run: python -m app.main seed

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f Dockerfile.api -t hr-talent-evaluator-api:ci .
      - name: Build the dashboard image
        run: docker build -t hr-talent-evaluator-frontend:ci ./frontend

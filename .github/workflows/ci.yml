name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        # Core only. The full test suite runs offline by design; installing the
        # optional voice/cognition extras here would mean CI never exercises the
        # degradation paths that production depends on.
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.6" "PyYAML>=6.0" "numpy>=1.26" "pytest>=8" ruff

      - name: Lint
        run: ruff check app tests scripts

      - name: Format check
        run: ruff format --check app tests scripts
        continue-on-error: true

      - name: Test suite (warnings are errors)
        run: pytest -q

      - name: OpenGAP / budget / security compliance
        run: python -m app.main verify

      - name: Latency benchmark (gates on p95)
        run: python scripts/benchmark.py --iterations 40

      - name: Offline screening demo
        run: python -m app.main demo

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hr-talent-evaluator:ci .
      - name: Verify compliance inside the image
        run: docker run --rm hr-talent-evaluator:ci verify

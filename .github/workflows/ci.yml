name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Install the core runtime plus the API/database dependencies required
        # by the complete offline test suite. Optional external services remain
        # unconfigured, so the degradation paths are still exercised.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pydantic>=2.6" \
            "PyYAML>=6.0" \
            "numpy>=1.26" \
            "pytest>=8" \
            "pytest-asyncio>=0.23" \
            "ruff" \
            "fastapi>=0.111" \
            "uvicorn[standard]>=0.29" \
            "python-multipart>=0.0.9" \
            "httpx>=0.27" \
            "httpx2>=2.13,<3" \
            "anyio>=4.6,<4.15" \
            "sqlalchemy>=2.0" \
            "alembic>=1.13" \
            "psycopg2-binary>=2.9" \
            "redis>=5.0"

      - name: Lint
        run: ruff check app tests scripts

      - name: Format check
        run: ruff format --check app tests scripts

      - name: Test suite (warnings are errors)
        run: pytest -q

      - name: OpenGAP / budget / security compliance
        run: python -m app.main verify

      - name: Latency benchmark (gates on p95)
        run: python scripts/benchmark.py --iterations 40

      - name: Offline screening demo
        run: python -m app.main demo

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hr-talent-evaluator:ci .
      - name: Verify compliance inside the image
        run: docker run --rm hr-talent-evaluator:ci verify

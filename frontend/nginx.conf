server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: candidate app and admin dashboard both use client-side
    # routes (react-router), so unknown paths fall back to index.html rather
    # than 404ing on a hard refresh of e.g. /admin/sessions/<id>.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /env-config.js {
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

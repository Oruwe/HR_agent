# =============================================================================
# Full stack, one command: `docker compose up --build`.
#
# Default profile: the API (SQLite on a named volume) plus the dashboard.
# No external services required -- with no GOOGLE_API_KEY set the analyst
# runs in its offline mode, which is a working product rather than an error
# page.
#
# `--profile postgres` swaps SQLite for a real Postgres container.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      HRTE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      HRTE_CORS_ORIGINS: ${HRTE_CORS_ORIGINS:-http://localhost:5173}
      HRTE_ADMIN_TOKEN: ${HRTE_ADMIN_TOKEN:-}
      HRTE_REDACTION_KEY: ${HRTE_REDACTION_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      HRTE_MODEL: ${HRTE_MODEL:-gemini-flash-latest}
      MOSS_PROJECT_ID: ${MOSS_PROJECT_ID:-}
      MOSS_PROJECT_KEY: ${MOSS_PROJECT_KEY:-}
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Opt-in: `docker compose --profile postgres up`
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: hrte
      POSTGRES_USER: hrte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrte_dev_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrte"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api-data:
  postgres-data:
